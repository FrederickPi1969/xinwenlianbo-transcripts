name: backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "起始日期 YYYYMMDD"
        required: true
      end:
        description: "结束日期 YYYYMMDD"
        required: true
      source:
        description: "数据源"
        type: choice
        default: auto
        options: [auto, cctv, govopendata]
      workers:
        description: "并行天数"
        default: "4"

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl range
        run: |
          python crawler/xwlb.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --source "${{ inputs.source }}" \
            --workers "${{ inputs.workers }}"

      - name: Rebuild index
        run: python crawler/build_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: backfill ${{ inputs.start }}..${{ inputs.end }}" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin ${GITHUB_REF_NAME:-main} && git push -q; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::push 失败"
          exit 1

